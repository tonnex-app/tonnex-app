<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONNEX - Glassmorphism Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #030712;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 { top: -5%; left: -10%; width: 320px; height: 320px; background: rgba(16, 185, 129, 0.35); }
        .orb-2 { top: 35%; right: -15%; width: 350px; height: 350px; background: rgba(59, 130, 246, 0.3); }
        .orb-3 { bottom: -5%; left: -5%; width: 300px; height: 300px; background: rgba(139, 92, 246, 0.25); }

        .glass-card {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(24px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.6) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12) !important;
        }

        .glass-inner {
            background: rgba(0, 0, 0, 0.25) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .active-tab {
            background: rgba(16, 185, 129, 0.25) !important;
            color: #34D399 !important;
            border: 1px solid rgba(16, 185, 129, 0.5) !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3) !important;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 pb-16 relative overflow-x-hidden">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Header -->
    <header class="glass-header sticky top-0 z-50 py-3.5 px-4 mb-4">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-400 to-teal-300 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-emerald-500/30">
                    TX
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider text-white leading-none">TONNEX</h1>
                    <p class="text-[10px] text-emerald-400 font-bold tracking-widest uppercase mt-0.5">Facility Operating System</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span id="currentDate" class="text-xs font-semibold glass-inner px-3 py-1.5 rounded-full text-slate-200 shadow-inner"></span>
                <button onclick="toggleAdminModal()" class="glass-inner px-3 py-1.5 rounded-full text-slate-200 hover:text-emerald-400 transition-all text-xs shadow-inner" title="Admin-Menü">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- App Container -->
    <main class="max-w-md mx-auto px-4 space-y-4 relative z-10">

        <!-- Progress Card -->
        <div class="glass-card p-5 rounded-3xl relative overflow-hidden">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-300">Tagesfortschritt</span>
                </div>
                <span id="progressPercent" class="text-xs font-extrabold text-emerald-400 bg-emerald-500/20 px-2.5 py-1 rounded-full border border-emerald-500/30">0%</span>
            </div>
            <div class="w-full bg-black/40 rounded-full h-3 p-0.5 border border-white/10 overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-emerald-400 to-teal-300 h-2 rounded-full transition-all duration-500 shadow-lg shadow-emerald-500/50" style="width: 0%"></div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="grid grid-cols-4 gap-1.5 p-1.5 glass-card rounded-2xl text-[11px] font-semibold">
            <button onclick="switchTab('today')" id="tabToday" class="py-2.5 rounded-xl text-center active-tab transition-all">Heute</button>
            <button onclick="switchTab('tomorrow')" id="tabTomorrow" class="py-2.5 rounded-xl text-center text-slate-300 hover:text-white transition-all">Morgen</button>
            <button onclick="switchTab('year')" id="tabYear" class="py-2.5 rounded-xl text-center text-slate-300 hover:text-white transition-all">Vorschau</button>
            <button onclick="switchTab('sync')" id="tabSync" class="py-2.5 rounded-xl text-center text-slate-300 hover:text-white transition-all"><i class="fa-solid fa-cloud-arrow-down"></i></button>
        </div>

        <!-- Task List Container -->
        <div id="taskList" class="space-y-3">
            <!-- Dynamisch via JavaScript -->
        </div>

    </main>

    <!-- Admin Modal / Dropdown -->
    <div id="adminModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="glass-card max-w-md w-full p-6 rounded-3xl space-y-4 relative border border-white/20 shadow-2xl">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                    <h3 class="font-bold text-white text-sm uppercase tracking-wider">Admin-Steuerung</h3>
                </div>
                <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-white text-sm">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="space-y-2">
                <p class="text-xs text-slate-300">Hier kannst du versehentlich als „Erledigt“ markierte Aufgaben zurücksetzen oder den Cache leeren.</p>
            </div>

            <div class="space-y-2">
                <h4 class="text-xs font-bold text-slate-200 uppercase">Aktive / Erledigte Tasks im Speicher:</h4>
                <div id="adminTaskList" class="max-h-48 overflow-y-auto space-y-2 pr-1 custom-scroll text-xs">
                    <!-- Wird per JS gefüllt -->
                </div>
            </div>

            <div class="pt-2 border-t border-white/10 flex justify-between items-center">
                <button onclick="resetAllData()" class="px-3 py-2 rounded-xl bg-red-500/20 text-red-300 border border-red-500/30 text-xs font-bold hover:bg-red-500/30 transition-all">
                    <i class="fa-solid fa-trash mr-1.5"></i> Alles zurücksetzen
                </button>
                <button onclick="toggleAdminModal()" class="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 text-xs font-black shadow-lg shadow-emerald-500/30">
                    Schließen
                </button>
            </div>
        </div>
    </div>

    <script>
        let propertiesData = [];

        let state = JSON.parse(localStorage.getItem('tonnex_state')) || {
            completedTasks: {},
            timestamps: {},
            photos: {}
        };

        const weekdays = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
        let currentTab = 'today';

        function getCalendarWeek(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return `${d.getUTCFullYear()}-W${Math.ceil((((d - yearStart) / 86400000) + 1) / 7)}`;
        }

        async function initApp() {
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
            
            try {
                const res = await fetch('data.json');
                if (res.ok) {
                    propertiesData = await res.json();
                }
            } catch (e) {
                console.error("Konnte data.json nicht laden:", e);
            }
            render();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['today', 'tomorrow', 'year', 'sync'].forEach(t => {
                const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                if (t === tab) {
                    el.className = "py-2.5 rounded-xl text-center active-tab transition-all font-bold";
                } else {
                    el.className = "py-2.5 rounded-xl text-center text-slate-300 hover:text-white transition-all";
                }
            });
            render();
        }

        function toggleTask(id, type) {
            const today = new Date();
            let key;
            if (type === 'bin') {
                const dateKey = today.toISOString().slice(0, 10);
                key = `${id}_bin_${dateKey}`;
            } else {
                const weekKey = getCalendarWeek(today);
                key = `${id}_clean_${weekKey}`;
            }

            if (state.completedTasks[key]) {
                delete state.completedTasks[key];
                delete state.timestamps[key];
            } else {
                state.completedTasks[key] = true;
                state.timestamps[key] = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            }
            saveState();
            render();
        }

        // Admin-Funktionen
        function toggleAdminModal() {
            const modal = document.getElementById('adminModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                renderAdminTaskList();
            } else {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }
        }

        function renderAdminTaskList() {
            const container = document.getElementById('adminTaskList');
            container.innerHTML = '';

            const keys = Object.keys(state.completedTasks);
            if (keys.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic">Keine Aufgaben im Speicher als erledigt markiert.</p>`;
                return;
            }

            keys.forEach(key => {
                // Key format z.B. "1_bin_2026-06-06" oder "3_clean_2026-W23"
                const parts = key.split('_');
                const propId = parts[0];
                const taskType = parts[1];
                const timeInfo = parts.slice(2).join('_');

                const prop = propertiesData.find(p => p.id == propId);
                const addressText = prop ? prop.address : `Objekt-ID ${propId}`;
                const typeText = taskType === 'bin' ? 'Mülltonne' : 'Putzen';

                const item = document.createElement('div');
                item.className = "glass-inner p-2.5 rounded-xl flex items-center justify-between";
                item.innerHTML = `
                    <div>
                        <div class="font-bold text-white">${addressText}</div>
                        <div class="text-[10px] text-slate-300">${typeText} (${timeInfo})</div>
                    </div>
                    <button onclick="adminUndoTask('${key}')" class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[11px] font-bold hover:bg-amber-500/30 transition-all">
                        Rückgängig
                    </button>
                `;
                container.appendChild(item);
            });
        }

        function adminUndoTask(key) {
            delete state.completedTasks[key];
            delete state.timestamps[key];
            saveState();
            renderAdminTaskList();
            render();
        }

        function resetAllData() {
            if (confirm("Möchtest du wirklich alle gespeicherten Erledigt-Status zurücksetzen?")) {
                state = { completedTasks: {}, timestamps: {}, photos: {} };
                saveState();
                renderAdminTaskList();
                render();
                toggleAdminModal();
            }
        }

        function handlePhotoUpload(event, id, type) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const today = new Date();
                    const key = type === 'bin' ? `${id}_bin_${today.toISOString().slice(0, 10)}` : `${id}_clean_${getCalendarWeek(today)}`;
                    state.photos[key] = e.target.result;
                    saveState();
                    render();
                };
                reader.readAsDataURL(file);
            }
        }

        function saveState() {
            localStorage.setItem('tonnex_state', JSON.stringify(state));
        }

        function render() {
            const container = document.getElementById('taskList');
            container.innerHTML = '';

            let totalCount = 0;
            let doneCount = 0;

            if (currentTab === 'sync') {
                container.innerHTML = `
                    <div class="glass-card p-5 rounded-3xl space-y-4">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-cloud-arrow-down text-emerald-400 text-base"></i>
                            <h3 class="text-sm font-bold text-slate-200 uppercase tracking-wider">iCal / ICS Kalender Sync</h3>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed">Die Abfalltermine für alle Städte werden vollautomatisch über GitHub Actions direkt von den API-Endpunkten synchronisiert.</p>
                        <div class="p-3 rounded-2xl glass-inner flex items-center justify-between text-xs text-emerald-400">
                            <span><i class="fa-solid fa-circle-check mr-1.5"></i> Status: Live-API aktiv</span>
                            <span class="text-slate-400">${propertiesData.length} Objekte</span>
                        </div>
                    </div>
                `;
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('progressPercent').innerText = '100%';
                return;
            }

            if (currentTab === 'year') {
                propertiesData.forEach(prop => {
                    const card = document.createElement('div');
                    card.className = "glass-card p-4 rounded-3xl space-y-3";
                    
                    let eventsList = (prop.calendarEvents || []).map(ev => `
                        <div class="flex justify-between items-center text-xs py-1.5 border-b border-white/5">
                            <span class="text-slate-200 font-medium"><i class="fa-solid fa-calendar-day text-emerald-400 mr-2"></i>${ev.title}</span>
                            <span class="text-emerald-300 font-mono">${ev.date}</span>
                        </div>
                    `).join('');

                    if (!eventsList) eventsList = `<p class="text-xs text-slate-400 italic">Keine Termine gefunden.</p>`;

                    card.innerHTML = `
                        <h3 class="font-bold text-white text-sm">${prop.address}</h3>
                        <div class="max-h-60 overflow-y-auto space-y-1 pr-1 custom-scroll">
                            ${eventsList}
                        </div>
                    `;
                    container.appendChild(card);
                });
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('progressPercent').innerText = '100%';
                return;
            }

            const todayDateObj = new Date();
            const todayStr = todayDateObj.toISOString().slice(0, 10);
            const currentWeekKey = getCalendarWeek(todayDateObj);
            
            const tomorrowDateObj = new Date();
            tomorrowDateObj.setDate(tomorrowDateObj.getDate() + 1);
            const tomorrowStr = tomorrowDateObj.toISOString().slice(0, 10);

            const dayAfterTomorrowDateObj = new Date();
            dayAfterTomorrowDateObj.setDate(dayAfterTomorrowDateObj.getDate() + 2);
            const dayAfterTomorrowStr = dayAfterTomorrowDateObj.toISOString().slice(0, 10);

            const trashTargetDates = currentTab === 'today' ? [tomorrowStr, dayAfterTomorrowStr] : [dayAfterTomorrowStr];
            
            const cleanTargetDateObj = currentTab === 'today' ? todayDateObj : tomorrowDateObj;
            const cleanTargetStr = currentTab === 'today' ? todayStr : tomorrowStr;
            const cleanTargetWeekdayName = weekdays[cleanTargetDateObj.getDay()];

            propertiesData.forEach(prop => {
                const matchingBinEvents = (prop.calendarEvents || []).filter(ev => trashTargetDates.includes(ev.date));
                const needsBin = matchingBinEvents.length > 0;

                const hasApiCleanEvent = (prop.calendarEvents || []).some(ev => ev.date === cleanTargetStr);
                const isCleanMatch = prop.cleanDay === cleanTargetWeekdayName;
                const needsClean = (hasApiCleanEvent || isCleanMatch);

                const cleanDoneKey = `${prop.id}_clean_${currentWeekKey}`;
                const isCleanDone = !!state.completedTasks[cleanDoneKey];
                const showClean = needsClean && !isCleanDone;

                if (needsBin || showClean) {
                    const binDoneKey = `${prop.id}_bin_${todayStr}`;
                    const isBinDone = !!state.completedTasks[binDoneKey];

                    if (needsBin && prop.tasks.includes('Tonnen')) { totalCount++; if (isBinDone) doneCount++; }
                    if (showClean && prop.tasks.includes('Putzen')) { totalCount++; if (isCleanDone) doneCount++; }

                    const cityBadgeColor = prop.city === 'Duisburg' ? 'bg-blue-500/20 text-blue-300 border-blue-400/30' : 
                                           prop.city === 'Essen' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/30' : 
                                           'bg-amber-500/20 text-amber-300 border-amber-400/30';

                    const card = document.createElement('div');
                    card.className = "glass-card p-4 rounded-3xl space-y-3";

                    let tasksHtml = '';
                    if (needsBin && prop.tasks.includes('Tonnen')) {
                        const binTitles = [...new Set(matchingBinEvents.map(e => e.title))].join(' & ');

                        tasksHtml += `
                            <div class="flex items-center justify-between p-3 rounded-2xl glass-inner">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-400/30 flex items-center justify-center text-base">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </div>
                                    <div>
                                        <div class="text-xs font-bold text-white">Tonnendienst: <span class="text-amber-300">${binTitles || 'Mülltonne'}</span></div>
                                        <div class="text-[11px] text-slate-300">Anstehende Abfuhr</div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <label class="cursor-pointer glass-inner text-slate-200 p-2 rounded-xl text-xs hover:bg-white/10 transition-all flex items-center">
                                        <i class="fa-solid fa-camera text-slate-300"></i>
                                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event, ${prop.id}, 'bin')">
                                    </label>
                                    <button onclick="toggleTask(${prop.id}, 'bin')" class="px-3 py-2 rounded-xl text-xs font-black transition-all ${isBinDone ? 'bg-emerald-400 text-slate-950 shadow-lg shadow-emerald-500/30' : 'glass-inner text-slate-200 hover:bg-white/10'}">
                                        ${isBinDone ? '<i class="fa-solid fa-check mr-1"></i> Erledigt' : 'Abhaken'}
                                    </button>
                                </div>
                            </div>
                        `;
                    }

                    if (showClean && prop.tasks.includes('Putzen')) {
                        tasksHtml += `
                            <div class="flex items-center justify-between p-3 rounded-2xl glass-inner">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-blue-300 border border-blue-400/30 flex items-center justify-center text-base">
                                        <i class="fa-solid fa-broom"></i>
                                    </div>
                                    <div>
                                        <div class="text-xs font-bold text-white">Treppenhaus Putzen</div>
                                        <div class="text-[11px] text-slate-300">Wöchentlicher Putztag</div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <label class="cursor-pointer glass-inner text-slate-200 p-2 rounded-xl text-xs hover:bg-white/10 transition-all flex items-center">
                                        <i class="fa-solid fa-camera text-slate-300"></i>
                                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event, ${prop.id}, 'clean')">
                                    </label>
                                    <button onclick="toggleTask(${prop.id}, 'clean')" class="px-3 py-2 rounded-xl text-xs font-black transition-all ${isCleanDone ? 'bg-emerald-400 text-slate-950 shadow-lg shadow-emerald-500/30' : 'glass-inner text-slate-200 hover:bg-white/10'}">
                                        ${isCleanDone ? '<i class="fa-solid fa-check mr-1"></i> Erledigt' : 'Abhaken'}
                                    </button>
                                </div>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full border ${cityBadgeColor} uppercase tracking-wider">${prop.city}</span>
                                <h3 class="font-bold text-white text-sm mt-1.5">${prop.address}</h3>
                            </div>
                        </div>
                        <div class="space-y-2 pt-1">${tasksHtml}</div>
                    `;
                    container.appendChild(card);
                }
            });

            if (container.children.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 rounded-3xl text-center space-y-2">
                        <div class="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 flex items-center justify-center mx-auto text-xl mb-3">
                            <i class="fa-solid fa-check-double"></i>
                        </div>
                        <h3 class="font-bold text-white text-base">Alles erledigt!</h3>
                        <p class="text-xs text-slate-300">Für diesen Tag stehen keine Aufgaben an.</p>
                    </div>
                `;
            }

            const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 100;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressPercent').innerText = pct + '%';
        }

        initApp();
    </script>
</body>
</html>
