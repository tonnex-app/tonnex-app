<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonnex - Objekt- & Müll-Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .active-tab { border-bottom: 3px solid #10B981; color: #10B981; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex items-center space-x-2">
                <div class="bg-emerald-500 text-slate-900 p-2 rounded-xl font-black text-xl tracking-wider">TX</div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white leading-none">TONNEX</h1>
                    <p class="text-xs text-emerald-400 font-medium mt-0.5">Objekt- & Müll-Manager</p>
                </div>
            </div>
            <span id="currentDate" class="text-xs bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 text-slate-300"></span>
        </div>
    </header>

    <!-- App Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Progress Overview -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Tagesfortschritt</span>
                <span id="progressPercent" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                <div id="progressBar" class="bg-emerald-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- Time Navigation Tabs -->
        <div class="flex bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden text-sm">
            <button onclick="switchTab('today')" id="tabToday" class="flex-1 py-3 text-center active-tab transition-all">Heute</button>
            <button onclick="switchTab('tomorrow')" id="tabTomorrow" class="flex-1 py-3 text-center text-slate-500 transition-all">Morgen</button>
            <button onclick="switchTab('all')" id="tabAll" class="flex-1 py-3 text-center text-slate-500 transition-all">Alle Objekte</button>
        </div>

        <!-- Auto Sync & Import Box -->
        <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-sm space-y-2">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider"><i class="fa-solid fa-sync mr-1"></i> Kalender-Sync (.ics)</h3>
                <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded">Auto-Feiertage</span>
            </div>
            <p class="text-xs text-slate-300">Lade hier die .ics-Dateien der Städte (WBD, EBE, WBO) hoch, um Feiertagsverschiebungen automatisch zu übernehmen.</p>
            <label class="block w-full bg-emerald-500 text-slate-900 text-center py-2 rounded-xl text-xs font-bold cursor-pointer hover:bg-emerald-400 transition-all mt-1">
                <i class="fa-solid fa-file-arrow-up mr-1"></i> Stadt-Kalender (.ics) importieren
                <input type="file" accept=".ics" class="hidden" onchange="importICS(event)">
            </label>
        </div>

        <!-- Task List Container -->
        <div id="taskList" class="space-y-3">
            <!-- Cards injected via JavaScript -->
        </div>

    </main>

    <script>
        const initialProperties = [
            { id: 1, city: 'Duisburg', address: 'Turmstr. 36, 47119 Duisburg', tasks: ['Tonnen', 'Putzen'], binDay: 'Dienstag', cleanDay: 'Montag' },
            { id: 2, city: 'Duisburg', address: 'Turmstr. 38, 47119 Duisburg', tasks: ['Tonnen', 'Putzen'], binDay: 'Dienstag', cleanDay: 'Montag' },
            { id: 3, city: 'Duisburg', address: 'Krummenhakstr. 26, Duisburg', tasks: ['Tonnen', 'Putzen'], binDay: 'Mittwoch', cleanDay: 'Dienstag' },
            { id: 4, city: 'Essen', address: 'Pferdemarkt 10, Essen', tasks: ['Tonnen'], binDay: 'Donnerstag', cleanDay: '' },
            { id: 5, city: 'Essen', address: 'Kreuzeskirchstr. 8, Essen', tasks: ['Tonnen'], binDay: 'Freitag', cleanDay: '' },
            { id: 6, city: 'Essen', address: 'Gerlingstr. 43, Essen', tasks: ['Tonnen'], binDay: 'Freitag', cleanDay: '' },
            { id: 7, city: 'Oberhausen', address: 'Linsingenstr. 2, Oberhausen', tasks: ['Tonnen'], binDay: 'Dienstag', cleanDay: '' }
        ];

        let state = JSON.parse(localStorage.getItem('tonnex_state')) || {
            completedTasks: {},
            timestamps: {},
            photos: {},
            icsEvents: []
        };

        const weekdays = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
        const todayIdx = new Date().getDay();
        const tomorrowIdx = (todayIdx + 1) % 7;

        let currentTab = 'today';

        function initApp() {
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
            render();
        }

        function importICS(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const events = parseICS(text);
                state.icsEvents = events;
                saveState();
                alert(`Erfolgreich ${events.length} Müllabhol-Termine aus der .ics-Datei importiert!`);
                render();
            };
            reader.readAsText(file);
        }

        function parseICS(icsData) {
            const events = [];
            const lines = icsData.split(/\r\n|\n|\r/);
            let currentEvent = null;

            lines.forEach(line => {
                if (line.startsWith('BEGIN:VEVENT')) {
                    currentEvent = {};
                } else if (line.startsWith('END:VEVENT')) {
                    if (currentEvent) events.push(currentEvent);
                    currentEvent = null;
                } else if (currentEvent) {
                    if (line.startsWith('SUMMARY:')) currentEvent.summary = line.replace('SUMMARY:', '').trim();
                    if (line.startsWith('DTSTART')) currentEvent.date = line.split(':')[1]?.substring(0, 8);
                }
            });
            return events;
        }

        function switchTab(tab) {
            currentTab = tab;
            ['today', 'tomorrow', 'all'].forEach(t => {
                const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                if (t === tab) {
                    el.className = "flex-1 py-3 text-center active-tab transition-all";
                } else {
                    el.className = "flex-1 py-3 text-center text-slate-500 transition-all";
                }
            });
            render();
        }

        function toggleTask(id, type) {
            const dateKey = new Date().toISOString().slice(0, 10);
            const key = `${id}_${type}_${dateKey}`;
            if (state.completedTasks[key]) {
                delete state.completedTasks[key];
                delete state.timestamps[key];
            } else {
                state.completedTasks[key] = true;
                state.timestamps[key] = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            }
            saveState();
            render();
        }

        function handlePhotoUpload(event, id, type) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dateKey = new Date().toISOString().slice(0, 10);
                    const key = `${id}_${type}_${dateKey}`;
                    state.photos[key] = e.target.result;
                    saveState();
                    render();
                };
                reader.readAsDataURL(file);
            }
        }

        function saveState() {
            localStorage.setItem('tonnex_state', JSON.stringify(state));
        }

        function render() {
            const container = document.getElementById('taskList');
            container.innerHTML = '';

            let totalCount = 0;
            let doneCount = 0;

            initialProperties.forEach(prop => {
                const todayName = weekdays[todayIdx];
                const tomorrowName = weekdays[tomorrowIdx];

                const isBinToday = prop.binDay === tomorrowName; 
                const isCleanToday = prop.cleanDay === todayName;

                const isBinTomorrow = prop.binDay === weekdays[(tomorrowIdx + 1) % 7];
                const isCleanTomorrow = prop.cleanDay === tomorrowName;

                let show = false;
                if (currentTab === 'today' && (isBinToday || isCleanToday)) show = true;
                if (currentTab === 'tomorrow' && (isBinTomorrow || isCleanTomorrow)) show = true;
                if (currentTab === 'all') show = true;

                if (show) {
                    const dateKey = new Date().toISOString().slice(0, 10);
                    const binDoneKey = `${prop.id}_bin_${dateKey}`;
                    const cleanDoneKey = `${prop.id}_clean_${dateKey}`;

                    const isBinDone = !!state.completedTasks[binDoneKey];
                    const isCleanDone = !!state.completedTasks[cleanDoneKey];

                    if (isBinToday) { totalCount++; if (isBinDone) doneCount++; }
                    if (isCleanToday) { totalCount++; if (isCleanDone) doneCount++; }

                    const cityBadgeColor = prop.city === 'Duisburg' ? 'bg-blue-100 text-blue-800' : 
                                           prop.city === 'Essen' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800';

                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3";

                    let tasksHtml = '';

                    if (prop.tasks.includes('Tonnen')) {
                        tasksHtml += `
                            <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                <div class="flex items-center space-x-2.5">
                                    <div class="w-8 h-8 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold">
                                        <i class="fa-solid fa-trash-can text-sm"></i>
                                    </div>
                                    <div>
                                        <div class="text-sm font-semibold">Tonnendienst</div>
                                        <div class="text-xs text-slate-500">${prop.binDay ? 'Abholung: ' + prop.binDay : 'Keine Abholung'}</div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <label class="cursor-pointer bg-slate-200 text-slate-700 p-2 rounded-lg text-xs hover:bg-slate-300 transition-all flex items-center space-x-1">
                                        <i class="fa-solid fa-camera"></i>
                                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event, ${prop.id}, 'bin')">
                                    </label>
                                    <button onclick="toggleTask(${prop.id}, 'bin')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${isBinDone ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-700'}">
                                        ${isBinDone ? '<i class="fa-solid fa-check mr-1"></i> Erledigt' : 'Abhaken'}
                                    </button>
                                </div>
                            </div>
                            ${state.photos[binDoneKey] ? `<div class="mt-1"><img src="${state.photos[binDoneKey]}" class="w-full h-24 object-cover rounded-xl border border-slate-200"></div>` : ''}
                        `;
                    }

                    if (prop.tasks.includes('Putzen')) {
                        tasksHtml += `
                            <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                <div class="flex items-center space-x-2.5">
                                    <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center font-bold">
                                        <i class="fa-solid fa-broom text-sm"></i>
                                    </div>
                                    <div>
                                        <div class="text-sm font-semibold">Treppenhaus Putzen</div>
                                        <div class="text-xs text-slate-500">${prop.cleanDay ? 'Putztag: ' + prop.cleanDay : 'Nach Bedarf'}</div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <label class="cursor-pointer bg-slate-200 text-slate-700 p-2 rounded-lg text-xs hover:bg-slate-300 transition-all flex items-center space-x-1">
                                        <i class="fa-solid fa-camera"></i>
                                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event, ${prop.id}, 'clean')">
                                    </label>
                                    <button onclick="toggleTask(${prop.id}, 'clean')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${isCleanDone ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-700'}">
                                        ${isCleanDone ? '<i class="fa-solid fa-check mr-1"></i> Erledigt' : 'Abhaken'}
                                    </button>
                                </div>
                            </div>
                            ${state.photos[cleanDoneKey] ? `<div class="mt-1"><img src="${state.photos[cleanDoneKey]}" class="w-full h-24 object-cover rounded-xl border border-slate-200"></div>` : ''}
                        `;
                    }

                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-bold px-2 py-0.5 rounded-md ${cityBadgeColor}">${prop.city}</span>
                                <h3 class="font-bold text-slate-900 mt-1">${prop.address}</h3>
                            </div>
                        </div>
                        <div class="space-y-2 pt-1">
                            ${tasksHtml}
                        </div>
                    `;
                    container.appendChild(card);
                }
            });

            if (container.children.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl text-center space-y-2 border border-slate-200">
                        <i class="fa-solid fa-circle-check text-4xl text-emerald-500 mb-2"></i>
                        <h3 class="font-bold text-slate-800">Alles erledigt!</h3>
                        <p class="text-xs text-slate-500">Für diesen Zeitraum stehen aktuell keine Aufgaben an.</p>
                    </div>
                `;
            }

            const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 100;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressPercent').innerText = pct + '%';
        }

        initApp();
    </script>
</body>
</html>
