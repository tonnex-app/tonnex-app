<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TONNEX - iOS Glass Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #090d16;
        }

        /* iOS Glassmorphism Effects */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Glowing Gradients */
        .neon-glow-emerald {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
        }

        .active-tab {
            background: rgba(16, 185, 129, 0.15) !important;
            color: #10B981 !important;
            border: 1px solid rgba(16, 185, 129, 0.4) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        /* Ambient Background Orbs */
        .ambient-orb-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-orb-2 {
            position: fixed;
            bottom: 10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 pb-16 relative overflow-x-hidden">

    <!-- Glowing Background Atmosphere -->
    <div class="ambient-orb-1"></div>
    <div class="ambient-orb-2"></div>

    <!-- Header -->
    <header class="glass-header sticky top-0 z-50 py-3.5 px-4 mb-4">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-300 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-emerald-500/20">
                    TX
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider text-white leading-none">TONNEX</h1>
                    <p class="text-[10px] text-emerald-400 font-semibold tracking-widest uppercase mt-0.5">Facility Operating System</p>
                </div>
            </div>
            <span id="currentDate" class="text-xs font-medium glass-pill px-3 py-1.5 rounded-full text-slate-300 border border-white/10 shadow-inner"></span>
        </div>
    </header>

    <!-- App Container -->
    <main class="max-w-md mx-auto px-4 space-y-4 relative z-10">

        <!-- Progress Card -->
        <div class="glass-card p-5 rounded-3xl relative overflow-hidden">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Tagesfortschritt</span>
                </div>
                <span id="progressPercent" class="text-xs font-extrabold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">0%</span>
            </div>
            <div class="w-full bg-slate-800/80 rounded-full h-3 p-0.5 border border-white/5 overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-2 rounded-full transition-all duration-500 shadow-sm" style="width: 0%"></div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="grid grid-cols-3 gap-2 p-1.5 glass-card rounded-2xl text-xs font-semibold">
            <button onclick="switchTab('today')" id="tabToday" class="py-2.5 rounded-xl text-center active-tab transition-all duration-300">Heute</button>
            <button onclick="switchTab('tomorrow')" id="tabTomorrow" class="py-2.5 rounded-xl text-center text-slate-400 hover:text-white transition-all duration-300">Morgen</button>
            <button onclick="switchTab('all')" id="tabAll" class="py-2.5 rounded-xl text-center text-slate-400 hover:text-white transition-all duration-300">Alle Objekte</button>
        </div>

        <!-- Kalender Sync Box -->
        <div class="glass-card p-4 rounded-3xl space-y-3 border-emerald-500/20">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-down text-emerald-400 text-sm"></i>
                    <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider">iCal / ICS Kalender Sync</h3>
                </div>
                <span class="text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20">Smart Auto</span>
            </div>
            <p class="text-xs text-slate-400 leading-relaxed">Sonderabholungen & Feiertagsverschiebungen der Städte (WBD, EBE, WBO) importieren.</p>
            <label class="flex items-center justify-center space-x-2 w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 py-2.5 rounded-2xl text-xs font-bold cursor-pointer transition-all shadow-lg shadow-emerald-500/10 active:scale-95">
                <i class="fa-solid fa-file-arrow-up"></i>
                <span>.ics Kalenderdatei laden</span>
                <input type="file" accept=".ics" class="hidden" onchange="importICS(event)">
            </label>
        </div>

        <!-- Task List Container -->
        <div id="taskList" class="space-y-3">
            <!-- Dynamisch via JavaScript -->
        </div>

    </main>

    <script>
        const initialProperties = [
            { id: 1, city: 'Duisburg', address: 'Turmstr. 36, 47119 Duisburg', tasks: ['Tonnen', 'Putzen'], binDay: 'Dienstag', cleanDay: 'Montag' },
            { id: 2, city: 'Duisburg', address: 'Turmstr. 38, 47119 Duisburg', tasks: ['Tonnen', 'Putzen'], binDay: 'Dienstag', cleanDay: 'Montag' },
            { id: 3, city: 'Duisburg', address: 'Krummenhakstr. 26, Duisburg', tasks: ['Tonnen', 'Putzen'], binDay: 'Mittwoch', cleanDay: 'Dienstag' },
            { id: 4, city: 'Essen', address: 'Pferdemarkt 10, Essen', tasks: ['Tonnen'], binDay: 'Donnerstag', cleanDay: '' },
            { id: 5, city: 'Essen', address: 'Kreuzeskirchstr. 8, Essen', tasks: ['Tonnen'], binDay: 'Freitag', cleanDay: '' },
            { id: 6, city: 'Essen', address: 'Gerlingstr. 43, Essen', tasks: ['Tonnen'], binDay: 'Freitag', cleanDay: '' },
            { id: 7, city: 'Oberhausen', address: 'Linsingenstr. 2, Oberhausen', tasks: ['Tonnen'], binDay: 'Dienstag', cleanDay: '' }
        ];

        let state = JSON.parse(localStorage.getItem('tonnex_state')) || {
            completedTasks: {},
            timestamps: {},
            photos: {},
            icsEvents: []
        };

        const weekdays = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
        const todayIdx = new Date().getDay();
        const tomorrowIdx = (todayIdx + 1) % 7;

        let currentTab = 'today';

        function initApp() {
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
            render();
        }

        function importICS(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const events = parseICS(text);
                state.icsEvents = events;
                saveState();
                alert(`Erfolgreich ${events.length} Termine aus der .ics-Datei importiert!`);
                render();
            };
            reader.readAsText(file);
        }

        function parseICS(icsData) {
            const events = [];
            const lines = icsData.split(/\r\n|\n|\r/);
            let currentEvent = null;

            lines.forEach(line => {
                if (line.startsWith('BEGIN:VEVENT')) {
                    currentEvent = {};
                } else if (line.startsWith('END:VEVENT')) {
                    if (currentEvent) events.push(currentEvent);
                    currentEvent = null;
                } else if (currentEvent) {
                    if (line.startsWith('SUMMARY:')) currentEvent.summary = line.replace('SUMMARY:', '').trim();
                    if (line.startsWith('DTSTART')) currentEvent.date = line.split(':')[1]?.substring(0, 8);
                }
            });
            return events;
        }

        function switchTab(tab) {
            currentTab = tab;
            ['today', 'tomorrow', 'all'].forEach(t => {
                const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                if (t === tab) {
                    el.className = "py-2.5 rounded-xl text-center active-tab transition-all duration-300 font-bold";
                } else {
                    el.className = "py-2.5 rounded-xl text-center text-slate-400 hover:text-white transition-all duration-300";
                }
            });
            render();
        }

        function toggleTask(id, type) {
            const dateKey = new Date().toISOString().slice(0, 10);
            const key = `${id}_${type}_${dateKey}`;
            if (state.completedTasks[key]) {
                delete state.completedTasks[key];
                delete state.timestamps[key];
            } else {
                state.completedTasks[key] = true;
                state.timestamps[key] = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            }
            saveState();
            render();
        }

        function handlePhotoUpload(event, id, type) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dateKey = new Date().toISOString().slice(0, 10);
                    const key = `${id}_${type}_${dateKey}`;
                    state.photos[key] = e.target.result;
                    saveState();
                    render();
                };
                reader.readAsDataURL(file);
            }
        }

        function saveState() {
            localStorage.setItem('tonnex_state', JSON.stringify(state));
        }

        function render() {
            const container = document.getElementById('taskList');
            container.innerHTML = '';

            let totalCount = 0;
            let doneCount = 0;

            initialProperties.forEach(prop => {
                const todayName = weekdays[todayIdx];
                const tomorrowName = weekdays[tomorrowIdx];

                const isBinToday = prop.binDay === tomorrowName; 
                const isCleanToday = prop.cleanDay === todayName;

                const isBinTomorrow = prop.binDay === weekdays[(tomorrowIdx + 1) % 7];
                const isCleanTomorrow = prop.cleanDay === tomorrowName;

                let show = false;
                if (currentTab === 'today' && (isBinToday || isCleanToday)) show = true;
                if (currentTab === 'tomorrow' && (isBinTomorrow || isCleanTomorrow)) show = true;
                if (currentTab === 'all') show = true;

                if (show) {
                    const dateKey = new Date().toISOString().slice(0, 10);
                    const binDoneKey = `${prop.id}_bin_${dateKey}`;
                    const cleanDoneKey = `${prop.id}_clean_${dateKey}`;

                    const isBinDone = !!state.completedTasks[binDoneKey];
                    const isCleanDone = !!state.completedTasks[cleanDoneKey];

                    if (isBinToday) { totalCount++; if (isBinDone) doneCount++; }
                    if (isCleanToday) { totalCount++; if (isCleanDone) doneCount++; }

                    const cityBadgeColor = prop.city === 'Duisburg' ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 
                                           prop.city === 'Essen' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 
                                           'bg-amber-500/10 text-amber-400 border-amber-500/20';

                    const card = document.createElement('div');
                    card.className = "glass-card p-4 rounded-3xl space-y-3";

                    let tasksHtml = '';

                    if (prop.tasks.includes('Tonnen')) {
                        tasksHtml += `
                            <div class="flex items-center justify-between p-3 rounded-2xl bg-white/[0.02] border border-white/5">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center text-base">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </div>
                                    <div>
                                        <div class="text-xs font-bold text-white">Tonnendienst</div>
                                        <div class="text-[11px] text-slate-400">${prop.binDay ? 'Abholung: ' + prop.binDay : 'Keine Abholung'}</div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <label class="cursor-pointer glass-pill text-slate-300 p-2 rounded-xl text-xs hover:bg-white/10 transition-all flex items-center">
                                        <i class="fa-solid fa-camera text-slate-400"></i>
                                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event, ${prop.id}, 'bin')">
                                    </label>
                                    <button onclick="toggleTask(${prop.id}, 'bin')" class="px-3 py-2 rounded-xl text-xs font-bold transition-all ${isBinDone ? 'bg-emerald-500 text-slate-950 font-black shadow-lg shadow-emerald-500/20' : 'glass-pill text-slate-300 hover:bg-white/10'}">
                                        ${isBinDone ? '<i class="fa-solid fa-check mr-1"></i> Erledigt' : 'Abhaken'}
                                    </button>
                                </div>
                            </div>
                            ${state.photos[binDoneKey] ? `<div class="mt-2"><img src="${state.photos[binDoneKey]}" class="w-full h-32 object-cover rounded-2xl border border-white/10"></div>` : ''}
                        `;
                    }

                    if (prop.tasks.includes('Putzen')) {
                        tasksHtml += `
                            <div class="flex items-center justify-between p-3 rounded-2xl bg-white/[0.02] border border-white/5">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center text-base">
                                        <i class="fa-solid fa-broom"></i>
                                    </div>
                                    <div>
                                        <div class="text-xs font-bold text-white">Treppenhaus Putzen</div>
                                        <div class="text-[11px] text-slate-400">${prop.cleanDay ? 'Putztag: ' + prop.cleanDay : 'Nach Bedarf'}</div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <label class="cursor-pointer glass-pill text-slate-300 p-2 rounded-xl text-xs hover:bg-white/10 transition-all flex items-center">
                                        <i class="fa-solid fa-camera text-slate-400"></i>
                                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload(event, ${prop.id}, 'clean')">
                                    </label>
                                    <button onclick="toggleTask(${prop.id}, 'clean')" class="px-3 py-2 rounded-xl text-xs font-bold transition-all ${isCleanDone ? 'bg-emerald-500 text-slate-950 font-black shadow-lg shadow-emerald-500/20' : 'glass-pill text-slate-300 hover:bg-white/10'}">
                                        ${isCleanDone ? '<i class="fa-solid fa-check mr-1"></i> Erledigt' : 'Abhaken'}
                                    </button>
                                </div>
                            </div>
                            ${state.photos[cleanDoneKey] ? `<div class="mt-2"><img src="${state.photos[cleanDoneKey]}" class="w-full h-32 object-cover rounded-2xl border border-white/10"></div>` : ''}
                        `;
                    }

                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full border ${cityBadgeColor} uppercase tracking-wider">${prop.city}</span>
                                <h3 class="font-bold text-white text-sm mt-1.5">${prop.address}</h3>
                            </div>
                        </div>
                        <div class="space-y-2 pt-1">
                            ${tasksHtml}
                        </div>
                    `;
                    container.appendChild(card);
                }
            });

            if (container.children.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 rounded-3xl text-center space-y-2">
                        <div class="w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center mx-auto text-xl mb-3">
                            <i class="fa-solid fa-check-double"></i>
                        </div>
                        <h3 class="font-bold text-white text-base">Alles erledigt!</h3>
                        <p class="text-xs text-slate-400">Für diesen Zeitraum stehen aktuell keine Aufgaben an.</p>
                    </div>
                `;
            }

            const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 100;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressPercent').innerText = pct + '%';
        }

        initApp();
    </script>
</body>
</html>
